[package]
name = "backend_stuff"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-native-tls", "migrate"] }
tokio = { version = "1.49.0", features = ["full"] }
dotenv = "0.15"
env = "1.0.1"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0.149"
argon2 = "0.5.3"
dotenvy = "0.15.7"
tower-http = { version = "0.6", features = ["cors"] }
